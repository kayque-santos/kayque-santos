<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <!-- Gradiente principal de fundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Gradiente da onda -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Gradiente da segunda onda -->
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Padrão de grid sutil -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.05"/>
    </pattern>

    <!-- Filtro de glow no nome -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo com gradiente -->
  <rect width="1200" height="280" fill="url(#bgGrad)"/>

  <!-- Padrão de grid sobreposto -->
  <rect width="1200" height="280" fill="url(#grid)"/>

  <!-- Ondas decorativas no fundo -->
  <path d="M 0 200 Q 300 160 600 200 T 1200 200 L 1200 280 L 0 280 Z" fill="url(#waveGrad)"/>
  <path d="M 0 230 Q 300 200 600 230 T 1200 230 L 1200 280 L 0 280 Z" fill="url(#waveGrad2)"/>

  <!-- Pontos decorativos (simulando "data points") -->
  <circle cx="80" cy="60" r="2" fill="#60A5FA" opacity="0.6"/>
  <circle cx="180" cy="100" r="2.5" fill="#93C5FD" opacity="0.5"/>
  <circle cx="1100" cy="80" r="2" fill="#60A5FA" opacity="0.6"/>
  <circle cx="1050" cy="140" r="2.5" fill="#93C5FD" opacity="0.5"/>
  <circle cx="950" cy="50" r="1.5" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="120" cy="180" r="1.5" fill="#FFFFFF" opacity="0.4"/>

  <!-- Linhas conectando pontos (vibe "rede de dados") -->
  <line x1="80" y1="60" x2="180" y2="100" stroke="#60A5FA" stroke-width="0.5" opacity="0.3"/>
  <line x1="1100" y1="80" x2="1050" y2="140" stroke="#60A5FA" stroke-width="0.5" opacity="0.3"/>

  <!-- Nome principal -->
  <text x="600" y="125" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="58" font-weight="700" fill="#FFFFFF" text-anchor="middle"
        filter="url(#glow)" letter-spacing="2">
    Kayque Santos
  </text>

  <!-- Linha decorativa abaixo do nome -->
  <line x1="500" y1="150" x2="700" y2="150" stroke="#60A5FA" stroke-width="2" opacity="0.7"/>

  <!-- Subtítulo -->
  <text x="600" y="185" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="22" font-weight="400" fill="#E0E7FF" text-anchor="middle" letter-spacing="3">
    DATA ENGINEER  ·  BI DEVELOPER  ·  AUTOMATION
  </text>
</svg>
