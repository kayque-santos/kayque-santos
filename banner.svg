<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 320" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Kayque Santos - Data Engineer, Data Scientist, BI Developer">
  <defs>
    <!-- Gradiente de fundo dark profundo com viés roxo -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#13111c"/>
      <stop offset="100%" stop-color="#1a1428"/>
    </linearGradient>

    <!-- Halo de luz roxa atrás do nome -->
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente do texto principal (sutil cintilância) -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>

    <!-- Padrão de grid sutil (dados / matrix-like) -->
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#A855F7" stroke-opacity="0.06" stroke-width="0.5"/>
    </pattern>

    <!-- Animação de pulso para os pontos -->
    <style>
      .pulse-1 { animation: pulse 2.8s ease-in-out infinite; }
      .pulse-2 { animation: pulse 3.2s ease-in-out infinite 0.4s; }
      .pulse-3 { animation: pulse 2.6s ease-in-out infinite 0.8s; }
      .pulse-4 { animation: pulse 3.5s ease-in-out infinite 1.2s; }
      .pulse-5 { animation: pulse 2.9s ease-in-out infinite 1.6s; }
      .flow-line { stroke-dasharray: 4 6; animation: dash 14s linear infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.4); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -200; }
      }
    </style>
  </defs>

  <!-- Fundo base -->
  <rect width="1400" height="320" fill="url(#bg)"/>

  <!-- Grid sutil de dados -->
  <rect width="1400" height="320" fill="url(#grid)"/>

  <!-- Halo central atrás do nome -->
  <ellipse cx="700" cy="160" rx="500" ry="180" fill="url(#halo)"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!--  ELEMENTO ESQUERDO — Mini schema de dados (pipeline)    -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g transform="translate(80, 90)" opacity="0.7">
    <!-- Nó: fonte -->
    <rect x="0" y="0" width="64" height="22" rx="3" fill="none" stroke="#A855F7" stroke-width="1" stroke-opacity="0.5"/>
    <text x="32" y="15" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#A855F7" text-anchor="middle" letter-spacing="1">FONTE</text>

    <!-- Linha animada -->
    <line class="flow-line" x1="64" y1="11" x2="100" y2="11" stroke="#A855F7" stroke-width="1" stroke-opacity="0.6"/>
    <circle class="pulse-1" cx="82" cy="11" r="1.5" fill="#A855F7"/>

    <!-- Nó: transform -->
    <rect x="100" y="0" width="64" height="22" rx="3" fill="none" stroke="#A855F7" stroke-width="1" stroke-opacity="0.5"/>
    <text x="132" y="15" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#A855F7" text-anchor="middle" letter-spacing="1">TRANSFORMA</text>

    <!-- Branch para baixo -->
    <path d="M 132 22 L 132 60 L 70 60 L 70 100" fill="none" stroke="#A855F7" stroke-width="1" stroke-opacity="0.4" class="flow-line"/>
    <path d="M 132 22 L 132 60 L 195 60 L 195 100" fill="none" stroke="#A855F7" stroke-width="1" stroke-opacity="0.4" class="flow-line"/>

    <!-- Nó: warehouse -->
    <rect x="38" y="100" width="64" height="22" rx="3" fill="none" stroke="#A855F7" stroke-width="1" stroke-opacity="0.5"/>
    <text x="70" y="115" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#A855F7" text-anchor="middle" letter-spacing="1">DADOS</text>

    <!-- Nó: ml -->
    <rect x="163" y="100" width="64" height="22" rx="3" fill="none" stroke="#A855F7" stroke-width="1" stroke-opacity="0.5"/>
    <text x="195" y="115" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#A855F7" text-anchor="middle" letter-spacing="1">BI / IA</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!--  ELEMENTO DIREITO — Métricas / estatísticas             -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g transform="translate(1110, 90)" opacity="0.7">
    <!-- Label superior -->
    <text x="0" y="0" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#A855F7" letter-spacing="2">// MÉTRICAS</text>

    <!-- Linha divisora -->
    <line x1="0" y1="10" x2="210" y2="10" stroke="#A855F7" stroke-width="0.5" stroke-opacity="0.4"/>

    <!-- Bars / sparklines estilizados -->
    <g transform="translate(0, 24)">
      <rect x="0"   y="20" width="6" height="12" fill="#A855F7" fill-opacity="0.4"/>
      <rect x="10"  y="14" width="6" height="18" fill="#A855F7" fill-opacity="0.5"/>
      <rect x="20"  y="8"  width="6" height="24" fill="#A855F7" fill-opacity="0.6"/>
      <rect x="30"  y="16" width="6" height="16" fill="#A855F7" fill-opacity="0.5"/>
      <rect x="40"  y="4"  width="6" height="28" fill="#A855F7" fill-opacity="0.8"/>
      <rect x="50"  y="10" width="6" height="22" fill="#A855F7" fill-opacity="0.6"/>
      <rect x="60"  y="0"  width="6" height="32" fill="#A855F7" fill-opacity="0.9"/>
      <rect x="70"  y="6"  width="6" height="26" fill="#A855F7" fill-opacity="0.7"/>
      <rect x="80"  y="12" width="6" height="20" fill="#A855F7" fill-opacity="0.5"/>
      <rect x="90"  y="2"  width="6" height="30" fill="#A855F7" fill-opacity="0.85"/>
      <rect x="100" y="8"  width="6" height="24" fill="#A855F7" fill-opacity="0.6"/>
      <rect x="110" y="14" width="6" height="18" fill="#A855F7" fill-opacity="0.5"/>
      <rect x="120" y="6"  width="6" height="26" fill="#A855F7" fill-opacity="0.7"/>
      <rect x="130" y="0"  width="6" height="32" fill="#A855F7" fill-opacity="0.9"/>
      <rect x="140" y="10" width="6" height="22" fill="#A855F7" fill-opacity="0.6"/>
      <rect x="150" y="18" width="6" height="14" fill="#A855F7" fill-opacity="0.4"/>
    </g>

    <!-- Texto inferior -->
    <text x="0" y="80" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#A855F7" letter-spacing="1" opacity="0.6">SERRA · ES · BR</text>
    <text x="0" y="95" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#A855F7" letter-spacing="1" opacity="0.6">v.2026</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!--  PONTOS DE DADOS FLUTUANTES (decorativos)               -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <circle class="pulse-2" cx="350" cy="60" r="2" fill="#A855F7"/>
  <circle class="pulse-3" cx="1050" cy="50" r="2" fill="#A855F7"/>
  <circle class="pulse-4" cx="380" cy="270" r="2" fill="#A855F7"/>
  <circle class="pulse-5" cx="1020" cy="260" r="2" fill="#A855F7"/>
  <circle class="pulse-1" cx="250" cy="200" r="1.5" fill="#A855F7" opacity="0.6"/>
  <circle class="pulse-2" cx="1150" cy="210" r="1.5" fill="#A855F7" opacity="0.6"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!--  CENTRO — Tipografia principal                          -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Label superior pequeno -->
  <text x="700" y="105" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#A855F7" text-anchor="middle" letter-spacing="6" opacity="0.85">— PORTFÓLIO · 2026 —</text>

  <!-- Nome principal — display serif refinado -->
  <text x="700" y="180" font-family="'Playfair Display', 'Georgia', serif" font-weight="700" font-size="62" fill="url(#nameGrad)" text-anchor="middle" letter-spacing="-1">Kayque Santos</text>

  <!-- Linha decorativa abaixo do nome -->
  <line x1="600" y1="200" x2="800" y2="200" stroke="#A855F7" stroke-width="1" opacity="0.5"/>
  <circle cx="700" cy="200" r="3" fill="#A855F7"/>

  <!-- Subtítulo — papéis -->
  <text x="700" y="235" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" fill="#cbd5e1" text-anchor="middle" letter-spacing="5">ENGENHARIA &#160;·&#160; CIÊNCIA DE DADOS &#160;·&#160; BI</text>

  <!-- Tagline inferior -->
  <text x="700" y="270" font-family="'Playfair Display', 'Georgia', serif" font-style="italic" font-size="15" fill="#A855F7" text-anchor="middle" opacity="0.9">— construindo confiança nos dados, uma pipeline por vez —</text>

</svg>
